# nginx.conf para SPA / PWA de MEP — Manga Editor Pro
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─── COMPRESIÓN GZIP ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ─── CABECERAS DE SEGURIDAD ────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8000 https://*.onrender.com https://*.vercel.app https://image.pollinations.ai https://api.replicate.com https://generativelanguage.googleapis.com; frame-ancestors 'none';" always;

    # ─── CACHÉ AGRESIVO PARA ASSETS ESTÁTICOS ──────────────────────────────
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── SERVICE WORKER Y MANIFEST (SIN CACHÉ PROLONGADO) ──────────────────
    location ~* (?:service-worker\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ─── ENRUTAMIENTO SPA (VITE / REACT ROUTER) ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
