services:
  # ─── 1. BACKEND FASTAPI EN RENDER ─────────────────────────────────────────
  - type: web
    name: mep-backend-api
    env: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /docs
    envVars:
      - key: ENTORNO
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mep-postgres-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false

  # ─── 2. FRONTEND SPA EN RENDER STATIC SITES ───────────────────────────────
  - type: web
    name: mep-manga-editor
    env: static
    region: frankfurt
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  # ─── 3. BASE DE DATOS POSTGRESQL ADMINISTRADA ────────────────────────────
  - name: mep-postgres-db
    region: frankfurt
    plan: starter
    databaseName: mep_manga_db
    user: mep_user
