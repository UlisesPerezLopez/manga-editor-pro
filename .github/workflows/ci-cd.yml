name: MEP CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── JOB 1: BACKEND LINT, TESTS & DB MIGRATION VERIFICATION ────────────────
  backend-ci:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify SQLite / PostgreSQL DB Schema Initialization
        run: |
          python -c "from database.init_db import init_db; init_db()"

      - name: Run Pytest Test Suite
        env:
          JWT_SECRET_KEY: test_secret_key_ci_cd_123456789
          ENTORNO: test
        run: |
          pytest tests/ -v --tb=short

  # ─── JOB 2: FRONTEND BUILD & PWA BUNDLE VERIFICATION ───────────────────────
  frontend-ci:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Vite SPA & PWA Bundle
        run: npm run build

      - name: Verify Output Artifacts
        run: |
          test -f dist/index.html && echo "✅ index.html generated"
          test -f dist/manifest.json || test -f public/manifest.json && echo "✅ PWA manifest verified"
